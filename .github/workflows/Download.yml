name: Download and Upload to Buzzheavier

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string
      quality:
        description: 'Video quality (yt-dlp format selector)'
        required: true
        type: string
        default: 'bestvideo[height<=720]+bestaudio/best[ext=mp4]/best'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp

      - name: Download video (retry up to 5 times)
        id: download
        shell: bash
        run: |
          mkdir -p downloads
          touch marker

          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"

            yt-dlp \
              --output "./downloads/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --format "${{ github.event.inputs.quality }}" \
              --merge-output-format mp4 \
              --retries 3 \
              --fragment-retries 10 \
              --no-check-certificate \
              --geo-bypass \
              --no-color \
              --ignore-errors \
              --newline \
              "${{ github.event.inputs.url }}" && {

                NEW_FILE=$(find downloads -type f -newer marker -print -quit)

                if [ -n "$NEW_FILE" ]; then
                  echo "Download succeeded: $NEW_FILE"
                  SUCCESS=true
                  break
                else
                  echo "Download finished but no file detected. Retrying..."
                fi
              } || {
                echo "Download attempt failed"
              }

            RETRY_COUNT=$((RETRY_COUNT+1))

            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 5
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "All download attempts failed"
            exit 1
          fi

          FILENAME=$(basename "$NEW_FILE")
          SIZE_BYTES=$(stat -c %s "$NEW_FILE")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "file_path=$NEW_FILE" >> $GITHUB_OUTPUT

      - name: Show file info
        run: |
          echo "✅ Download successful!"
          echo "📁 File: ${{ steps.download.outputs.filename }}"
          echo "📊 Size: ${{ steps.download.outputs.size_mb }} MB"

      - name: Upload to Buzzheavier (with retry)
        id: buzzheavier
        run: |
          FILE_PATH="${{ steps.download.outputs.file_path }}"
          
          echo "📤 Uploading to Buzzheavier..."
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          UPLOAD_SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Upload attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            
            RESPONSE=$(curl -s -F "file=@$FILE_PATH" https://w.buzzheavier.com/upload)
            
            DOWNLOAD_URL=$(echo $RESPONSE | grep -o '"url":"[^"]*"' | cut -d '"' -f 4)
            
            if [ -n "$DOWNLOAD_URL" ]; then
              echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
              UPLOAD_SUCCESS=true
              echo "✅ Upload successful!"
              break
            else
              echo "⚠️ Upload failed. Retrying in 5 seconds..."
              sleep 5
            fi
            
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          if [ "$UPLOAD_SUCCESS" = false ]; then
            echo "❌ All upload attempts failed"
            exit 1
          fi

      - name: Show Download Link
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "✅ File successfully uploaded to Buzzheavier!"
          echo "══════════════════════════════════════════════════════════"
          echo ""
          echo "📁 File: ${{ steps.download.outputs.filename }}"
          echo "📊 Size: ${{ steps.download.outputs.size_mb }} MB"
          echo ""
          echo "🔗 Download Link:"
          echo "   ${{ steps.buzzheavier.outputs.download_url }}"
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo ""
          echo "⚠️ Notes:"
          echo "   - File stays on Buzzheavier for at least 8 days"
          echo "   - If downloaded 60+ times, it becomes permanent"
          echo "   - No file size limit (supports very large files)"
          echo "   - Save this link now!"
